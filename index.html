<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบยืนยันการใช้อุปกรณ์สื่อโสตฯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <div class="mobile-layout">
    <div class="page-content center">

      <div class="card" style="text-align: center;">
        <div
          style="width: 4rem; height: 4rem; background-color: var(--blue-100); color: var(--blue-600); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
          <i data-lucide="map-pin" style="width: 2rem; height: 2rem;"></i>
        </div>

        <h1 class="card-title">ยินดีต้อนรับสู่ระบบ</h1>
        <p class="card-subtitle">ระบบยืนยันการใช้ห้องเรียนและอุปกรณ์สื่อโสตฯ</p>

        <div
          style="background-color: var(--slate-50); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--slate-100); margin-bottom: 2rem;">
          <p class="text-sm text-slate-600 mb-1">คุณกำลังจะลงชื่อเข้าใช้ห้อง:</p>
          <p class="text-xl font-bold text-slate-800" id="room-id-display">Unknown</p>
        </div>

        <div class="text-left text-sm text-slate-600 mb-8" style="display: flex; flex-direction: column; gap: 1rem;">
          <div class="flex" style="gap: 0.75rem; align-items: flex-start;">
            <div
              style="width: 1.5rem; height: 1.5rem; border-radius: 50%; background-color: var(--blue-50); color: var(--blue-500); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              1</div>
            <p>ระบบจะขออนุญาตเข้าถึง <b>ตำแหน่ง (Location)</b> เพื่อตรวจสอบว่าคุณอยู่ในบริเวณห้องเรียน</p>
          </div>
          <div class="flex" style="gap: 0.75rem; align-items: flex-start;">
            <div
              style="width: 1.5rem; height: 1.5rem; border-radius: 50%; background-color: var(--blue-50); color: var(--blue-500); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <i data-lucide="camera" style="width: 14px; height: 14px;"></i>
            </div>
            <p>ระบบจะขออนุญาตเข้าถึง <b>กล้อง (Camera)</b> เพื่อถ่ายภาพยืนยันการเข้าสอน</p>
          </div>
        </div>

        <button id="login-btn" class="btn btn-primary">
          <i data-lucide="log-in" style="width: 20px; height: 20px;"></i>
          <span id="login-text">เข้าสู่ระบบด้วย Google</span>
        </button>
        <p class="text-xs text-slate-400 mt-4 mb-6">
          * กรุณาใช้อีเมลของสถาบันในการเข้าสู่ระบบ
        </p>

        <div style="border-top: 1px solid var(--slate-100); margin: 1.5rem 0; padding-top: 1.5rem;">
          <button id="admin-login-btn" class="btn"
            style="background-color: white; border: 1px solid var(--slate-200); color: var(--slate-600);">
            <i data-lucide="settings" style="width: 20px; height: 20px;"></i>
            <span>เข้าสู่ระบบสำหรับเจ้าหน้าที่ (Admin)</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="js/index.js"></script>
</body>

</html>
