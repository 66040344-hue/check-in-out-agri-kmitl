<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงชื่อเข้าใช้ - ระบบยืนยันการใช้อุปกรณ์สื่อโสตฯ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- Success Screen -->
  <div id="success-screen" class="hidden mobile-layout" style="background-color: var(--emerald-50);">
    <div class="page-content center text-center">
      <div
        style="width: 5rem; height: 5rem; background-color: var(--emerald-500); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; animation: bounce 1s infinite;">
        <i data-lucide="check-circle-2" style="width: 40px; height: 40px;"></i>
      </div>
      <h1 class="text-2xl font-bold text-emerald-800 mb-2">เข้าใช้งานสำเร็จ</h1>
      <p style="color: var(--emerald-600);">บันทึกข้อมูลการเข้าสอนเรียบร้อยแล้ว</p>
      <button onclick="window.history.back()"
        style="margin-top: 2rem; color: var(--emerald-700); text-decoration: underline; font-weight: 500; background: none; border: none; cursor: pointer;">
        กลับสู่เมนูหลัก
      </button>
    </div>
  </div>

  <!-- Form Screen -->
  <div id="form-screen" class="mobile-layout">
    <div class="page-content">

      <div class="flex items-center mb-6">
        <button onclick="history.back()" class="btn-icon-back">
          <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
        </button>
        <h1 class="text-xl font-bold text-slate-800" style="margin-left: 1rem;">ลงชื่อเข้าใช้</h1>
      </div>

      <div class="card mb-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <p class="text-sm text-slate-500">ห้องเรียน</p>
            <p class="text-xl font-bold text-slate-800" id="room-id-display">Unknown</p>
          </div>
          <div class="text-right">
            <p class="text-sm text-slate-500">ผู้สอน</p>
            <p class="text-base font-semibold text-slate-700" id="user-name">กำลังโหลด...</p>
          </div>
        </div>

        <!-- Status Container -->
        <div id="status-container"></div>
      </div>

      <div class="form-group flex-1">
        <label class="form-label">เบอร์โทรศัพท์ติดต่อ</label>
        <input type="tel" id="phone-input" class="form-input mb-4" placeholder="08x-xxx-xxxx" disabled>

        <label class="form-label">ถ่ายภาพยืนยันการเข้าสอน</label>
        <label id="upload-area" class="upload-area disabled">
          <div id="upload-icon-container" style="text-align: center;">
            <i data-lucide="camera"
              style="width: 32px; height: 32px; margin-bottom: 0.5rem; display: inline-block;"></i>
            <p id="upload-text">แตะเพื่อเปิดกล้อง</p>
          </div>
          <input type="file" id="photo-input" accept="image/*" capture="environment" class="hidden">
        </label>
      </div>

      <button id="btn-submit" class="btn btn-primary mt-8" disabled>
        บันทึกข้อมูล Check-in
      </button>

    </div>
  </div>

  <style>
    @keyframes bounce {

      0%,
      100% {
        transform: translateY(-5%);
        animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
      }

      50% {
        transform: translateY(0);
        animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
      }
    }
  </style>
  <script type="module" src="js/check-in.js"></script>
</body>

</html>
